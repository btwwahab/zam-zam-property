name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /var/www/zamzam-property
            git fetch origin main
            git reset --hard origin/main
            php8.4 /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction
            php8.4 artisan migrate --force
            php8.4 artisan config:cache
            php8.4 artisan route:cache
            php8.4 artisan view:cache
            find . -mindepth 1 -maxdepth 1 ! -name public -exec chmod -R o-rwx {} +
            chmod 600 .env
            sudo -n /usr/bin/systemctl reload php8.4-fpm
