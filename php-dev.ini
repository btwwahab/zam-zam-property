; Dev server overrides for `php -c php-dev.ini artisan serve`
; Extensions still load from /etc/php/8.4/cli/conf.d/*
memory_limit = 512M
max_execution_time = 300
max_input_time = 300

; --- file uploads: allow hero videos ---
file_uploads = On
upload_max_filesize = 64M
post_max_size = 72M
max_file_uploads = 30

; keep errors visible in dev
display_errors = On
error_reporting = E_ALL
date.timezone = Asia/Karachi
