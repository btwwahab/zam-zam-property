<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 75" width="340" height="75" fill="none">
  <defs>
    <linearGradient id="zzGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="50%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <linearGradient id="zzGoldShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DCFCE7" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#22C55E" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Backgroundless Monogram Emblem Mark -->
  <g transform="translate(10, 8)" filter="url(#subtleGlow)">
    <!-- Outer Shield / Diamond Outline -->
    <path d="M 30 2 L 56 16 L 56 42 L 30 56 L 4 42 L 4 16 Z" fill="none" stroke="url(#zzGoldGrad)" stroke-width="2.5" opacity="0.9"/>
    
    <!-- Inner Architectural Z Monogram Motif -->
    <!-- First Z -->
    <path d="M 16 18 L 34 18 L 18 34 L 34 34" fill="none" stroke="url(#zzGoldShine)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Second Z (Offset / Interlocking) -->
    <path d="M 26 24 L 44 24 L 28 40 L 44 40" fill="none" stroke="url(#zzGoldGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Central Diamond Core Accent -->
    <polygon points="30,27 33,30 30,33 27,30" fill="url(#zzGoldShine)"/>
  </g>

  <!-- Backgroundless Text Typography -->
  <!-- Brand Name: ZAM ZAM -->
  <text x="78" y="38" font-family="'Plus Jakarta Sans', 'Outfit', 'Montserrat', sans-serif" font-weight="800" font-size="25" fill="#0B2E1E" letter-spacing="1">
    ZAM <tspan fill="url(#zzGoldGrad)">ZAM</tspan>
  </text>
  
  <!-- Subtitle: ESTATE -->
  <text x="79" y="56" font-family="'Plus Jakarta Sans', 'Outfit', 'Montserrat', sans-serif" font-weight="700" font-size="12" fill="#22C55E" letter-spacing="5.5">
    ESTATE
  </text>
</svg>
